<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
<style>
.a{stroke:#c8461f}.f{fill:#c8461f}
@media (prefers-color-scheme:dark){.a{stroke:#f07a52}.f{fill:#f07a52}}
.draw{stroke-dasharray:1;animation:draw 2.6s cubic-bezier(.45,.05,.3,1) .5s backwards}
.pop{animation:pop .5s ease-out backwards}
.c1{animation-delay:1.15s}.c2{animation-delay:1.85s}.c3{animation-delay:2.45s}.top{animation-delay:3s}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out 3.2s 2}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0}}
@keyframes ring{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){.draw,.pop,.ring{animation:none}}
</style>
